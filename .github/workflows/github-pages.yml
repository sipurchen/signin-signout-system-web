name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      # ── Codex BEGIN: enforce public web-only source / 強制公開倉庫只保留 Web 來源 ──
      - name: Verify minimal public tree
        shell: bash
        run: |
          unexpected="$(git ls-tree --name-only HEAD | grep -Ev '^(\.env\.example|\.github|\.gitignore|App\.tsx|README\.md|app\.json|babel\.config\.js|package\.json|package-lock\.json|src|tsconfig\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected public repository paths:"
            echo "$unexpected"
            exit 1
          fi
      - name: Verify web-only dependencies
        run: |
          node -e "const p=require('./package-lock.json'); const root=p.packages['']; const banned=['electron','electron-builder','expo-http-server','expo-network']; const found=banned.filter((name)=>(root.dependencies||{})[name]||(root.devDependencies||{})[name]); if(found.length) throw new Error('Non-web dependencies: '+found.join(', '));"
      - name: Typecheck web runtime
        run: npm run typecheck
      # ── Codex END ──
      - name: Export Expo web build
        run: npm run web:export
      - name: Prepare SPA fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
